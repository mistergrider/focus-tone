<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Tone — AM Focus Music Generator</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --accent: #6ee7d1;
    --accent2: #f6c177;
    --text: #e6e8ec;
    --muted: #8b91a0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #1a1e28, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border-radius: 20px;
    padding: 28px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.06);
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 4px;
    letter-spacing: 0.5px;
  }
  .sub {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 24px;
  }
  .row {
    margin-bottom: 18px;
  }
  .row label {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--text);
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 24px;
    flex-shrink: 0;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .slider-toggle {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: #2a2f3a;
    border-radius: 999px;
    transition: 0.2s;
  }
  .slider-toggle::before {
    content: "";
    position: absolute;
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background: var(--muted);
    border-radius: 50%;
    transition: 0.2s;
  }
  .switch input:checked + .slider-toggle {
    background: rgba(110,231,209,0.25);
  }
  .switch input:checked + .slider-toggle::before {
    transform: translateX(20px);
    background: var(--accent);
  }
  select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    background: #1f232c;
    color: var(--text);
    font-size: 0.85rem;
  }
  .play-wrap {
    display: flex;
    justify-content: center;
    margin: 28px 0 8px;
  }
  #playBtn {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(145deg, var(--accent), #4bc9ae);
    color: #0f1115;
    font-size: 1.6rem;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(110,231,209,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s;
  }
  #playBtn:active { transform: scale(0.95); }
  #playBtn.playing {
    background: linear-gradient(145deg, var(--accent2), #d9a24f);
    box-shadow: 0 8px 24px rgba(246,193,119,0.35);
  }
  .status {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    height: 18px;
  }
  .elapsed {
    text-align: center;
    color: var(--accent2);
    font-size: 0.75rem;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }
  .viz-wrap {
    position: relative;
    margin-top: 14px;
  }
  canvas {
    width: 100%;
    height: 60px;
    display: block;
    border-radius: 8px;
    background: #0d0f14;
  }
  .fs-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.45);
    color: var(--text);
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .viz-wrap.fullscreen-active {
    position: fixed;
    inset: 0;
    z-index: 9999;
    margin: 0;
    background: #0d0f14;
    display: flex;
  }
  .viz-wrap.fullscreen-active canvas {
    width: 100vw;
    height: 100vh;
    border-radius: 0;
  }
  .viz-wrap.fullscreen-active .fs-btn {
    top: 16px;
    right: 16px;
  }

  .pomo-title {
    font-size: 1.05rem;
    margin: 0 0 16px;
    letter-spacing: 0.5px;
    text-align: center;
  }
  .preset-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .preset-btn {
    flex: 1;
    padding: 10px 6px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    background: #1f232c;
    color: var(--text);
    font-size: 0.85rem;
    cursor: pointer;
  }
  .preset-btn.active {
    border-color: var(--accent2);
    background: rgba(246,193,119,0.14);
    color: var(--accent2);
  }
  .preset-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .ring-wrap {
    position: relative;
    width: 100%;
    max-width: 220px;
    aspect-ratio: 1 / 1;
    margin: 0 auto 20px;
  }
  .ring-svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  .ring-bg {
    fill: none;
    stroke: #1f232c;
    stroke-width: 10;
  }
  .ring-progress {
    fill: none;
    stroke: var(--accent2);
    stroke-width: 10;
    stroke-linecap: round;
  }
  .ring-time {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', monospace;
    font-size: 1.8rem;
    font-variant-numeric: tabular-nums;
  }
  .pomo-controls {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  .pomo-controls button {
    flex: 1;
    padding: 10px 6px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    background: #1f232c;
    color: var(--text);
    font-size: 0.85rem;
    cursor: pointer;
  }
  #pomodoroStartBtn {
    border-color: var(--accent);
    background: rgba(110,231,209,0.14);
    color: var(--accent);
  }
  .task-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .task-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #1f232c;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 8px 10px;
  }
  .task-item.dragging {
    opacity: 0.4;
  }
  .drag-handle {
    color: var(--muted);
    cursor: grab;
    font-size: 0.9rem;
    line-height: 1;
    user-select: none;
    touch-action: none;
  }
  .task-input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 0.85rem;
    outline: none;
  }
  .task-input::placeholder {
    color: var(--muted);
  }

  @media (min-width: 900px) {
    body {
      padding: 0;
      align-items: stretch;
      justify-content: stretch;
    }
    .card {
      width: 100vw;
      max-width: 100vw;
      height: 100vh;
      border-radius: 0;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 28px;
      padding: 28px;
    }
    .control-panel {
      flex: 0 0 20%;
      min-width: 300px;
      max-width: 420px;
      height: 100%;
      overflow-y: auto; /* safety net only — panel is sized to avoid needing it */
    }
    .viz-panel {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-width: 0; /* allow flex child to shrink below content size */
      height: 100%;
    }
    .viz-panel .viz-wrap {
      flex: 1 1 auto;
      margin-top: 0;
      height: 100%;
    }
    .viz-panel canvas {
      height: 100%;
    }
    .pomodoro-panel {
      flex: 0 0 22%;
      min-width: 300px;
      max-width: 380px;
      height: 100%;
      overflow-y: auto;
      border-left: 1px solid rgba(255,255,255,0.08);
      padding-left: 28px;
    }
  }
</style>
</head>
<body>
<div class="card">
<div class="control-panel">
  <h1>Focus Tone</h1>
  <div class="sub">Amplitude-modulated ambient bed for sustained attention</div>

  <div class="row">
    <label><span>Brainwave Target</span></label>
    <select id="modeSelect">
      <option value="3" data-band="Delta">Delta — 3 Hz — Deep Rest</option>
      <option value="6" data-band="Theta">Theta — 6 Hz — Meditative</option>
      <option value="10" data-band="Alpha">Alpha — 10 Hz — Calm Focus</option>
      <option value="18" data-band="Beta" selected>Beta — 18 Hz — Active Focus</option>
      <option value="40" data-band="Gamma">Gamma — 40 Hz — Peak Alertness</option>
    </select>
  </div>

  <div class="row">
    <label><span>Modulation Depth</span><span id="depthVal">55%</span></label>
    <input type="range" id="depth" min="10" max="90" value="55">
  </div>
  <div class="row">
    <label><span>Pad Volume</span><span id="padVal">60%</span></label>
    <input type="range" id="padVol" min="0" max="100" value="60">
  </div>
  <div class="row">
    <label><span>Noise Type</span></label>
    <select id="noiseType">
      <option value="brown" selected>Brown</option>
      <option value="pink">Pink</option>
      <option value="white">White</option>
      <option value="rain">Rain</option>
      <option value="waves">Waves</option>
    </select>
  </div>
  <div class="row">
    <label><span>Noise Bed</span><span id="noiseVal">25%</span></label>
    <input type="range" id="noiseVol" min="0" max="100" value="25">
  </div>
  <div class="row toggle-row">
    <span>Modulate Noise</span>
    <label class="switch">
      <input type="checkbox" id="noiseAMToggle">
      <span class="slider-toggle"></span>
    </label>
  </div>

  <div class="row toggle-row">
    <span>Chord Loop</span>
    <label class="switch">
      <input type="checkbox" id="chordLoopToggle">
      <span class="slider-toggle"></span>
    </label>
  </div>
  <div class="row" id="chordControls" style="display:none;">
    <label><span>Progression</span></label>
    <select id="progressionSelect">
      <option value="ambient1">Am – F – C – G</option>
      <option value="ambient2">Dm ↔ C (open drone)</option>
    </select>
    <label style="margin-top:14px;"><span>Chord Length</span><span id="chordLenVal">16s</span></label>
    <input type="range" id="chordLength" min="6" max="40" value="16">
  </div>

  <div class="play-wrap">
    <button id="playBtn">▶</button>
  </div>
  <div class="status" id="status">Tap play to start</div>
  <div class="elapsed" id="elapsedTime">00:00</div>
  <div class="row" style="margin-top:16px;">
    <label><span>Visualizer</span></label>
    <select id="vizModeSelect">
      <option value="bars">Bars</option>
      <option value="waves" selected>Waves</option>
      <option value="radial">Radial</option>
      <option value="particles">Particles</option>
    </select>
  </div>
</div>
<div class="viz-panel">
  <div class="viz-wrap" id="vizWrap">
    <canvas id="viz"></canvas>
    <button class="fs-btn" id="fullscreenBtn" title="Full screen">⛶</button>
  </div>
</div>
<div class="pomodoro-panel">
  <h2 class="pomo-title">Pomodoro</h2>

  <div class="preset-row">
    <button class="preset-btn active" data-mins="25">25 min</button>
    <button class="preset-btn" data-mins="45">45 min</button>
  </div>

  <div class="ring-wrap">
    <svg viewBox="0 0 200 200" class="ring-svg">
      <circle class="ring-bg" cx="100" cy="100" r="90"></circle>
      <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="90"></circle>
    </svg>
    <div class="ring-time" id="pomodoroTime">25:00</div>
  </div>

  <div class="pomo-controls">
    <button id="pomodoroStartBtn">Start</button>
    <button id="pomodoroResetBtn">Reset</button>
  </div>

  <div class="task-list" id="taskList">
    <div class="task-item">
      <span class="drag-handle" title="Drag to reorder">⋮⋮</span>
      <input type="text" class="task-input" placeholder="First thing to focus on">
    </div>
    <div class="task-item">
      <span class="drag-handle" title="Drag to reorder">⋮⋮</span>
      <input type="text" class="task-input" placeholder="Second thing">
    </div>
    <div class="task-item">
      <span class="drag-handle" title="Drag to reorder">⋮⋮</span>
      <input type="text" class="task-input" placeholder="Third thing">
    </div>
  </div>
</div>
</div>

<script>
let ctx, master, lfo, lfoGain, busGain, dryBus, reverbSend, padGains = [], padOscs = [], noiseGain, noiseCleanup = null;
let analyser, dataArray, waveformArray, animId;
let playing = false;
let modRate = 18;
let modBandLabel = 'Beta';
let graphBuilt = false;
let padWave;
let noiseAMEnabled = false;
let noiseTypeSelected = 'brown';
let vizMode = 'waves';
let vizHue = 200;
let particles = [];

// Time-tracking chime (bell tone) — reused by the Pomodoro timer on completion
let sessionStartTime = null;
let elapsedIntervalId = null;

const baseFreqs = [110, 165, 220]; // A2, E3, A3 — simple open chord pad, used when chord loop is off

// Chord loop state
let chordLoopEnabled = false;
let currentProgressionKey = 'ambient1';
let chordDuration = 16;   // seconds each chord holds before crossfading
const crossfadeTime = 3;  // seconds for the crossfade itself
let chordIndex = 0;
let activeLayer = 'A';
let layerAGain, layerBGain;
let layerAOscs = [], layerBOscs = [];
let chordTimeoutId = null;

const progressions = {
  ambient1: {
    name: 'Am – F – C – G',
    chords: [
      [110.00, 130.81, 164.81], // Am  (A2 C3 E3)
      [87.31, 110.00, 130.81],  // F   (F2 A2 C3)
      [130.81, 164.81, 196.00], // C   (C3 E3 G3)
      [98.00, 123.47, 146.83],  // G   (G2 B2 D3)
    ]
  },
  ambient2: {
    name: 'Dm ↔ C (open drone)',
    chords: [
      [73.42, 110.00, 130.81],  // Dm-ish open voicing (D2 A2 C3)
      [65.41, 98.00, 123.47],   // Cmaj-ish open voicing (C2 G2 B2)
    ]
  }
};

function ensureContext() {
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) {
      document.getElementById('status').textContent = 'Web Audio not supported on this browser';
      return null;
    }
    ctx = new AC();
  }
  return ctx;
}

// Builds one chord's worth of detuned, panned chorus oscillators into destGain.
// Returns the oscillator list so the caller can stop them later.
function buildChordVoices(freqs, destGain) {
  const detuneCents = [-6, 0, 6];
  const pans = [-0.35, 0, 0.35];
  const oscs = [];
  freqs.forEach((f) => {
    detuneCents.forEach((cents, i) => {
      const osc = ctx.createOscillator();
      osc.setPeriodicWave(padWave);
      osc.frequency.value = f;
      osc.detune.value = cents;

      const panner = ctx.createStereoPanner();
      panner.pan.value = pans[i];

      const g = ctx.createGain();
      g.gain.value = 0.5 / (freqs.length * detuneCents.length);

      osc.connect(g);
      g.connect(panner);
      panner.connect(destGain);
      osc.start();
      oscs.push(osc);
    });
  });
  return oscs;
}

function statusPlayingText() {
  let msg = 'Playing — ' + modBandLabel + ' (' + modRate + ' Hz)';
  if (chordLoopEnabled) msg += ' + chord loop';
  return msg;
}

// --- Noise bed generators ---
// Each returns { stop() } so buildGraph/teardown can clean it up uniformly.
// All feed into a shared destGain (volume + AM-routing already handled by caller).

function makeNoiseBuffer(seconds, fillFn) {
  const bufferSize = Math.floor(seconds * ctx.sampleRate);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  fillFn(buffer.getChannelData(0), bufferSize);
  return buffer;
}

function fillWhite(data) {
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
}

function fillPink(data) {
  // Paul Kellet's "economy" pink noise filter
  let b0 = 0, b1 = 0, b2 = 0;
  for (let i = 0; i < data.length; i++) {
    const white = Math.random() * 2 - 1;
    b0 = 0.99886 * b0 + white * 0.0555179;
    b1 = 0.99332 * b1 + white * 0.0750759;
    b2 = 0.96900 * b2 + white * 0.1538520;
    data[i] = (b0 + b1 + b2 + white * 0.1848) * 0.2;
  }
}

function fillBrown(data) {
  let lastOut = 0;
  for (let i = 0; i < data.length; i++) {
    const white = Math.random() * 2 - 1;
    lastOut = (lastOut + 0.02 * white) / 1.02;
    data[i] = lastOut * 3.5;
  }
}

function buildLoopingSource(fillFn, filterConfig, destGain) {
  const buffer = makeNoiseBuffer(3, fillFn);
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  src.loop = true;

  let lastNode = src;
  if (filterConfig) {
    const filter = ctx.createBiquadFilter();
    filter.type = filterConfig.type;
    filter.frequency.value = filterConfig.freq;
    if (filterConfig.q) filter.Q.value = filterConfig.q;
    src.connect(filter);
    lastNode = filter;
  }
  lastNode.connect(destGain);
  src.start();
  return src;
}

function buildWhiteNoise(destGain) {
  const src = buildLoopingSource(fillWhite, { type: 'lowpass', freq: 16000 }, destGain);
  return { stop: () => { try { src.stop(); } catch (e) {} } };
}

function buildPinkNoise(destGain) {
  const src = buildLoopingSource(fillPink, null, destGain);
  return { stop: () => { try { src.stop(); } catch (e) {} } };
}

function buildBrownNoise(destGain) {
  const src = buildLoopingSource(fillBrown, { type: 'lowpass', freq: 700 }, destGain);
  return { stop: () => { try { src.stop(); } catch (e) {} } };
}

function buildRainNoise(destGain) {
  // Steady "wash" layer + randomly-scheduled droplet transients
  const washGain = ctx.createGain();
  washGain.gain.value = 0.4;
  washGain.connect(destGain);
  const washSrc = buildLoopingSource(fillPink, { type: 'bandpass', freq: 2200, q: 0.7 }, washGain);

  let timeoutId = null;
  let stopped = false;

  function playDrop() {
    const dur = 0.05 + Math.random() * 0.05;
    const buf = makeNoiseBuffer(dur, (data) => {
      for (let i = 0; i < data.length; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);
      }
    });
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 800 + Math.random() * 3200;
    bp.Q.value = 5;
    const g = ctx.createGain();
    g.gain.value = 0.12 + Math.random() * 0.18;
    src.connect(bp);
    bp.connect(g);
    g.connect(destGain);
    src.start();
    src.stop(ctx.currentTime + dur + 0.05);
  }

  function scheduleNext() {
    if (stopped) return;
    const gap = 20 + Math.random() * 140;
    timeoutId = setTimeout(() => {
      playDrop();
      scheduleNext();
    }, gap);
  }
  scheduleNext();

  return {
    stop: () => {
      stopped = true;
      clearTimeout(timeoutId);
      try { washSrc.stop(); } catch (e) {}
    }
  };
}

function buildWavesNoise(destGain) {
  const waveGain = ctx.createGain();
  waveGain.gain.value = 0.5;
  waveGain.connect(destGain);

  const washSrc = buildLoopingSource(fillPink, { type: 'lowpass', freq: 900 }, waveGain);

  // Two slow, slightly out-of-phase LFOs summed create a natural,
  // non-repeating swell rather than one obviously periodic pulse.
  const lfo1 = ctx.createOscillator();
  lfo1.type = 'sine';
  lfo1.frequency.value = 1 / 7;
  const lfo1Gain = ctx.createGain();
  lfo1Gain.gain.value = 0.2;
  lfo1.connect(lfo1Gain);
  lfo1Gain.connect(waveGain.gain);
  lfo1.start();

  const lfo2 = ctx.createOscillator();
  lfo2.type = 'sine';
  lfo2.frequency.value = 1 / 11;
  const lfo2Gain = ctx.createGain();
  lfo2Gain.gain.value = 0.15;
  lfo2.connect(lfo2Gain);
  lfo2Gain.connect(waveGain.gain);
  lfo2.start();

  return {
    stop: () => {
      try { washSrc.stop(); } catch (e) {}
      try { lfo1.stop(); } catch (e) {}
      try { lfo2.stop(); } catch (e) {}
    }
  };
}

function buildNoiseSource(type, destGain) {
  switch (type) {
    case 'white': return buildWhiteNoise(destGain);
    case 'pink': return buildPinkNoise(destGain);
    case 'rain': return buildRainNoise(destGain);
    case 'waves': return buildWavesNoise(destGain);
    case 'brown':
    default: return buildBrownNoise(destGain);
  }
}

// --- Time-tracking chime ---
// A short struck-bell tone (inharmonic partials, fast attack, slow decay).
// Routed straight to master (and the reverb tail) rather than through
// busGain/dryBus, so it stays clearly audible no matter what the pad/noise
// volumes or AM settings are doing.
function playChime() {
  if (!ctx || !master) return;
  const t0 = ctx.currentTime;
  const fundamental = 523.25; // C5
  const partials = [1, 2.76, 4.07]; // inharmonic ratios for a bell-like timbre
  const peakGains = [0.32, 0.14, 0.07];

  partials.forEach((mult, i) => {
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = fundamental * mult;

    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(peakGains[i], t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 2.4);

    osc.connect(g);
    g.connect(master);
    if (reverbSend) g.connect(reverbSend);
    osc.start(t0);
    osc.stop(t0 + 2.5);
  });
}

function formatElapsed(ms) {
  const totalSeconds = Math.floor(ms / 1000);
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;
  const pad = (n) => n.toString().padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}

function updateElapsedDisplay() {
  if (!sessionStartTime) return;
  const el = document.getElementById('elapsedTime');
  if (el) el.textContent = formatElapsed(performance.now() - sessionStartTime);
}

function startElapsedTimer() {
  sessionStartTime = performance.now();
  updateElapsedDisplay();
  elapsedIntervalId = setInterval(updateElapsedDisplay, 1000);
}

function stopElapsedTimer() {
  clearInterval(elapsedIntervalId);
  elapsedIntervalId = null;
  sessionStartTime = null;
  const el = document.getElementById('elapsedTime');
  if (el) el.textContent = '00:00';
}

// --- Pomodoro timer ---
const RING_RADIUS = 90;
const RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;

let pomodoroDuration = 25 * 60;
let pomodoroRemaining = pomodoroDuration;
let pomodoroRunning = false;
let pomodoroIntervalId = null;

function formatMinSec(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function updatePomodoroRing() {
  const ring = document.getElementById('ringProgress');
  if (!ring) return;
  ring.style.strokeDasharray = RING_CIRCUMFERENCE;
  const elapsedFraction = 1 - (pomodoroRemaining / pomodoroDuration);
  // Ring fills up (shows elapsed time) rather than draining down.
  ring.style.strokeDashoffset = RING_CIRCUMFERENCE * (1 - elapsedFraction);
  const timeEl = document.getElementById('pomodoroTime');
  if (timeEl) timeEl.textContent = formatMinSec(pomodoroRemaining);
}

function hideAllButTopTask() {
  document.querySelectorAll('#taskList .task-item').forEach((el, i) => {
    el.style.display = i === 0 ? 'flex' : 'none';
  });
}

function showAllTasks() {
  document.querySelectorAll('#taskList .task-item').forEach(el => {
    el.style.display = 'flex';
  });
}

function setPresetButtonsDisabled(disabled) {
  document.querySelectorAll('.preset-btn').forEach(b => { b.disabled = disabled; });
}

function tickPomodoro() {
  pomodoroRemaining--;
  updatePomodoroRing();
  if (pomodoroRemaining <= 0) {
    clearInterval(pomodoroIntervalId);
    pomodoroRunning = false;
    document.getElementById('pomodoroStartBtn').textContent = 'Start';
    setPresetButtonsDisabled(false);
    showAllTasks();
    playChime(); // reuse the bell tone as the session-complete signal
  }
}

function startPomodoro() {
  const c = ensureContext();
  if (c) c.resume().catch(() => {});
  if (pomodoroRemaining <= 0) pomodoroRemaining = pomodoroDuration;
  pomodoroRunning = true;
  pomodoroIntervalId = setInterval(tickPomodoro, 1000);
  document.getElementById('pomodoroStartBtn').textContent = 'Pause';
  setPresetButtonsDisabled(true);
  hideAllButTopTask();
}

function pausePomodoro() {
  pomodoroRunning = false;
  clearInterval(pomodoroIntervalId);
  document.getElementById('pomodoroStartBtn').textContent = 'Resume';
}

function resetPomodoro() {
  clearInterval(pomodoroIntervalId);
  pomodoroRunning = false;
  pomodoroRemaining = pomodoroDuration;
  updatePomodoroRing();
  document.getElementById('pomodoroStartBtn').textContent = 'Start';
  setPresetButtonsDisabled(false);
  showAllTasks();
}

document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (pomodoroRunning) return;
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    pomodoroDuration = parseInt(btn.dataset.mins, 10) * 60;
    pomodoroRemaining = pomodoroDuration;
    updatePomodoroRing();
  });
});

document.getElementById('pomodoroStartBtn').addEventListener('click', () => {
  if (!pomodoroRunning) startPomodoro();
  else pausePomodoro();
});

document.getElementById('pomodoroResetBtn').addEventListener('click', resetPomodoro);

updatePomodoroRing(); // initialize ring/time display on load

// Drag-to-reorder for the 3-item task list. Dragging is initiated from the
// handle only (not the text input) so typing/selecting text isn't disrupted.
// Since we move the actual DOM nodes (not a separate data array), whatever
// row ends up first in the DOM is simply "the top thing" — no extra state
// bookkeeping needed.
let dragSrcItem = null;

document.querySelectorAll('#taskList .task-item').forEach(item => {
  const handle = item.querySelector('.drag-handle');
  handle.setAttribute('draggable', 'true');

  handle.addEventListener('dragstart', () => {
    dragSrcItem = item;
    item.classList.add('dragging');
  });
  handle.addEventListener('dragend', () => {
    item.classList.remove('dragging');
    dragSrcItem = null;
  });

  item.addEventListener('dragover', (e) => e.preventDefault());

  item.addEventListener('drop', (e) => {
    e.preventDefault();
    if (!dragSrcItem || dragSrcItem === item) return;
    const list = document.getElementById('taskList');
    const rows = Array.from(list.children);
    const srcIndex = rows.indexOf(dragSrcItem);
    const targetIndex = rows.indexOf(item);
    if (srcIndex < targetIndex) {
      list.insertBefore(dragSrcItem, item.nextSibling);
    } else {
      list.insertBefore(dragSrcItem, item);
    }
  });
});

function scheduleNextChord() {
  clearTimeout(chordTimeoutId);
  chordTimeoutId = setTimeout(() => {
    if (!playing || !chordLoopEnabled) return;
    const prog = progressions[currentProgressionKey];
    chordIndex = (chordIndex + 1) % prog.chords.length;
    crossfadeToChord(prog.chords[chordIndex]);
  }, chordDuration * 1000);
}

function crossfadeToChord(freqs) {
  const now = ctx.currentTime;
  const fromGain = activeLayer === 'A' ? layerAGain : layerBGain;
  const toGain = activeLayer === 'A' ? layerBGain : layerAGain;

  const newOscs = buildChordVoices(freqs, toGain);

  toGain.gain.cancelScheduledValues(now);
  toGain.gain.setValueAtTime(toGain.gain.value, now);
  toGain.gain.linearRampToValueAtTime(1, now + crossfadeTime);

  fromGain.gain.cancelScheduledValues(now);
  fromGain.gain.setValueAtTime(fromGain.gain.value, now);
  fromGain.gain.linearRampToValueAtTime(0, now + crossfadeTime);

  const oldOscs = activeLayer === 'A' ? layerAOscs : layerBOscs;
  setTimeout(() => {
    oldOscs.forEach(o => { try { o.stop(); } catch (e) {} });
  }, crossfadeTime * 1000 + 150);

  if (activeLayer === 'A') {
    layerBOscs = newOscs;
    activeLayer = 'B';
  } else {
    layerAOscs = newOscs;
    activeLayer = 'A';
  }

  scheduleNextChord();
}

function buildGraph() {
  master = ctx.createGain();
  master.gain.value = 1;
  master.connect(ctx.destination);

  analyser = ctx.createAnalyser();
  analyser.fftSize = 1024;
  dataArray = new Uint8Array(analyser.frequencyBinCount);
  waveformArray = new Uint8Array(analyser.fftSize);
  master.connect(analyser);

  // Bus that gets amplitude-modulated
  busGain = ctx.createGain();
  const depth = parseFloat(document.getElementById('depth').value) / 100;
  busGain.gain.value = 1 - depth / 2;
  busGain.connect(master);

  // Parallel unmodulated bus — lets the noise bed opt out of AM
  // while everything routed through busGain (the pad) stays modulated.
  dryBus = ctx.createGain();
  dryBus.gain.value = 1;
  dryBus.connect(master);

  // LFO driving the AM
  lfo = ctx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.value = modRate;
  lfoGain = ctx.createGain();
  lfoGain.gain.value = depth / 2;
  lfo.connect(lfoGain);
  lfoGain.connect(busGain.gain);
  lfo.start();

  // Pad: richer harmonic waveform, detuned chorus voices, stereo spread
  const padFilter = ctx.createBiquadFilter();
  padFilter.type = 'lowpass';
  padFilter.frequency.value = 1200;

  // Slow "breathing" LFO on the filter cutoff so the tone isn't static
  const filterLfo = ctx.createOscillator();
  filterLfo.type = 'sine';
  filterLfo.frequency.value = 0.07; // ~14 second cycle
  const filterLfoGain = ctx.createGain();
  filterLfoGain.gain.value = 350;
  filterLfo.connect(filterLfoGain);
  filterLfoGain.connect(padFilter.frequency);
  filterLfo.start();
  padOscs.push(filterLfo); // stop it alongside everything else

  const padMasterGain = ctx.createGain();
  padMasterGain.gain.value = 0; // soft attack: fade in below
  padMasterGain.connect(padFilter);
  padFilter.connect(busGain);
  padGains.push(padMasterGain);

  const targetPadVol = parseFloat(document.getElementById('padVol').value) / 100;
  padMasterGain.gain.setValueAtTime(0, ctx.currentTime);
  padMasterGain.gain.linearRampToValueAtTime(targetPadVol, ctx.currentTime + 1.8);

  // Custom periodic wave: a few soft, quickly-rolling-off harmonics
  // (warmer than a pure sine, gentler than a sawtooth/square)
  const harmonicCount = 6;
  const real = new Float32Array(harmonicCount);
  const imag = new Float32Array(harmonicCount);
  for (let n = 1; n < harmonicCount; n++) {
    imag[n] = 1 / Math.pow(n, 2.1); // steep rolloff keeps it smooth, not buzzy
  }
  padWave = ctx.createPeriodicWave(real, imag, { disableNormalization: false });

  // Two identical layers: one holds the current chord, the other silently
  // pre-builds the next one, then they crossfade. When chord loop is off,
  // layer A just holds the static baseFreqs chord and layer B stays empty.
  layerAGain = ctx.createGain();
  layerAGain.gain.value = 1;
  layerAGain.connect(padMasterGain);

  layerBGain = ctx.createGain();
  layerBGain.gain.value = 0;
  layerBGain.connect(padMasterGain);

  chordIndex = 0;
  activeLayer = 'A';
  const initialFreqs = chordLoopEnabled ? progressions[currentProgressionKey].chords[0] : baseFreqs;
  layerAOscs = buildChordVoices(initialFreqs, layerAGain);
  layerBOscs = [];

  if (chordLoopEnabled) {
    scheduleNextChord();
  }

  // Simple feedback-delay reverb for space, applied to the whole bus
  reverbSend = ctx.createGain();
  reverbSend.gain.value = 0.35;
  const delay = ctx.createDelay(1.0);
  delay.delayTime.value = 0.28;
  const feedback = ctx.createGain();
  feedback.gain.value = 0.38;
  const reverbFilter = ctx.createBiquadFilter();
  reverbFilter.type = 'lowpass';
  reverbFilter.frequency.value = 2200;

  busGain.connect(reverbSend);
  dryBus.connect(reverbSend);
  reverbSend.connect(delay);
  delay.connect(reverbFilter);
  reverbFilter.connect(feedback);
  feedback.connect(delay);
  delay.connect(master);

  // Noise bed: output gain is volume-controlled and routed to either the
  // AM-modulated bus or the dry bus depending on the "Modulate Noise" toggle.
  // The actual texture (white/pink/brown/rain/waves) feeds into this gain.
  noiseGain = ctx.createGain();
  noiseGain.gain.value = parseFloat(document.getElementById('noiseVol').value) / 100 * 0.6;
  noiseGain.connect(noiseAMEnabled ? busGain : dryBus);

  noiseCleanup = buildNoiseSource(noiseTypeSelected, noiseGain);
}

function teardownGraph() {
  try {
    lfo && lfo.stop();
    padOscs.forEach(o => o.stop());
    layerAOscs.forEach(o => { try { o.stop(); } catch (e) {} });
    layerBOscs.forEach(o => { try { o.stop(); } catch (e) {} });
    noiseCleanup && noiseCleanup.stop();
  } catch (e) {}
  padOscs = [];
  layerAOscs = [];
  layerBOscs = [];
  padGains = [];
  noiseCleanup = null;
  clearTimeout(chordTimeoutId);
  cancelAnimationFrame(animId);
  // Note: we deliberately do NOT close/null the AudioContext itself.
  // Reusing one persistent context (just stopping/rebuilding nodes)
  // avoids a known iOS Safari issue where repeatedly creating and
  // closing AudioContexts causes audio to silently stop working.
}

function initParticles(canvas) {
  particles = [];
  const count = 40;
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 0.6,
      vy: (Math.random() - 0.5) * 0.6,
      size: 1 + Math.random() * 2
    });
  }
}

function drawViz() {
  const canvas = document.getElementById('viz');
  const c = canvas.getContext('2d');
  canvas.width = canvas.clientWidth * devicePixelRatio;
  canvas.height = canvas.clientHeight * devicePixelRatio;
  initParticles(canvas);

  const bgFade = 'rgba(13,15,20,0.22)'; // matches canvas CSS background, used for motion trails on waves/radial

  // Particles use their own, much slower fade so trails actually accumulate
  // and become visible, plus a two-phase cycle: "filling" (slow fade, trails
  // build up) until the canvas gets bright, then "clearing" (fast fade) until
  // it's dark again. Brightness is checked by drawing a tiny downscaled copy
  // of the canvas and averaging its pixels — cheap, and avoids reading the
  // full-resolution canvas every frame.
  const sampleCanvas = document.createElement('canvas');
  sampleCanvas.width = 8;
  sampleCanvas.height = 8;
  const sampleCtx = sampleCanvas.getContext('2d');
  let particlePhase = 'filling';
  let lastPhaseChange = performance.now();
  let sampleFrameCounter = 0;

  const FILL_ALPHA = 0.035;   // very slow fade — trails linger and stack up
  const CLEAR_ALPHA = 0.12;   // faster fade — actively wipes the canvas
  const FILL_THRESHOLD = 70;  // avg brightness (0-255) that triggers clearing
  const EMPTY_THRESHOLD = 18; // avg brightness that triggers filling again
  const MIN_PHASE_MS = 2500;  // don't flip phases more often than this

  function drawBars() {
    analyser.getByteFrequencyData(dataArray);
    c.clearRect(0, 0, canvas.width, canvas.height);
    const barCount = dataArray.length / 2;
    const barWidth = canvas.width / barCount * 1.05;
    let x = 0;
    for (let i = 0; i < barCount; i++) {
      const barHeight = (dataArray[i] / 255) * canvas.height;
      const hue = 165 + (i / barCount) * 60;
      c.fillStyle = `hsl(${hue}, 70%, 60%)`;
      c.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
      x += barWidth + 1;
    }
  }

  function drawWaves() {
    analyser.getByteTimeDomainData(waveformArray);
    c.fillStyle = bgFade;
    c.fillRect(0, 0, canvas.width, canvas.height);

    vizHue = (vizHue + 0.4) % 360;
    c.lineWidth = 2 * devicePixelRatio;
    c.strokeStyle = `hsl(${vizHue}, 80%, 65%)`;
    c.shadowBlur = 8;
    c.shadowColor = `hsl(${vizHue}, 90%, 60%)`;
    c.beginPath();
    const sliceWidth = canvas.width / waveformArray.length;
    let x = 0;
    for (let i = 0; i < waveformArray.length; i++) {
      const v = waveformArray[i] / 128.0; // ~1.0 at silence
      const y = (v * canvas.height) / 2;
      if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
      x += sliceWidth;
    }
    c.stroke();
    c.shadowBlur = 0;
  }

  function drawRadial() {
    analyser.getByteFrequencyData(dataArray);
    c.fillStyle = bgFade;
    c.fillRect(0, 0, canvas.width, canvas.height);

    const cx = canvas.width / 2, cy = canvas.height / 2;
    const third = Math.floor(dataArray.length / 3);
    const avg = (start, end) => {
      let sum = 0;
      for (let i = start; i < end; i++) sum += dataArray[i];
      return sum / (end - start);
    };
    const bass = avg(0, third);
    const mid = avg(third, third * 2);
    const treble = avg(third * 2, dataArray.length);
    const energies = [bass, mid, treble];

    vizHue = (vizHue + 0.6) % 360;
    const baseRadius = Math.min(canvas.width, canvas.height) * 0.14;
    for (let ring = 0; ring < 3; ring++) {
      const radius = baseRadius + energies[ring] * 0.5 + ring * 16 * devicePixelRatio;
      c.beginPath();
      c.arc(cx, cy, radius, 0, Math.PI * 2);
      c.strokeStyle = `hsla(${(vizHue + ring * 45) % 360}, 80%, 60%, 0.85)`;
      c.lineWidth = 3 * devicePixelRatio;
      c.stroke();
    }
  }

  function drawParticles() {
    analyser.getByteFrequencyData(dataArray);

    const fadeAlpha = particlePhase === 'clearing' ? CLEAR_ALPHA : FILL_ALPHA;
    c.fillStyle = `rgba(13,15,20,${fadeAlpha})`;
    c.fillRect(0, 0, canvas.width, canvas.height);

    let energy = 0;
    for (let i = 0; i < dataArray.length; i++) energy += dataArray[i];
    energy = energy / dataArray.length / 255; // 0..1

    vizHue = (vizHue + 0.3) % 360;
    particles.forEach(p => {
      p.x += p.vx * (1 + energy * 4);
      p.y += p.vy * (1 + energy * 4);
      if (p.x < 0) p.x = canvas.width; if (p.x > canvas.width) p.x = 0;
      if (p.y < 0) p.y = canvas.height; if (p.y > canvas.height) p.y = 0;
      const r = p.size * devicePixelRatio * (1 + energy * 2);
      c.beginPath();
      c.arc(p.x, p.y, r, 0, Math.PI * 2);
      c.fillStyle = `hsla(${vizHue}, 80%, 65%, 0.85)`;
      c.fill();
    });

    // Sample overall brightness every few frames to decide phase flips.
    sampleFrameCounter++;
    if (sampleFrameCounter % 10 === 0) {
      sampleCtx.drawImage(canvas, 0, 0, 8, 8);
      const data = sampleCtx.getImageData(0, 0, 8, 8).data;
      let sum = 0;
      for (let i = 0; i < data.length; i += 4) {
        sum += (data[i] + data[i + 1] + data[i + 2]) / 3;
      }
      const avgBrightness = sum / (data.length / 4);
      const now = performance.now();

      if (now - lastPhaseChange > MIN_PHASE_MS) {
        if (particlePhase === 'filling' && avgBrightness > FILL_THRESHOLD) {
          particlePhase = 'clearing';
          lastPhaseChange = now;
        } else if (particlePhase === 'clearing' && avgBrightness < EMPTY_THRESHOLD) {
          particlePhase = 'filling';
          lastPhaseChange = now;
        }
      }
    }
  }

  function loop(now) {
    animId = requestAnimationFrame(loop);

    switch (vizMode) {
      case 'waves': drawWaves(); break;
      case 'radial': drawRadial(); break;
      case 'particles': drawParticles(); break;
      case 'bars':
      default: drawBars(); break;
    }
  }
  requestAnimationFrame(loop);
}

document.getElementById('playBtn').addEventListener('click', () => {
  const btn = document.getElementById('playBtn');
  const status = document.getElementById('status');

  if (!playing) {
    const c = ensureContext();
    if (!c) return;

    status.textContent = 'Starting audio…';

    // Must resume synchronously-ish within the tap gesture on iOS/Safari.
    c.resume().then(() => {
      try {
        buildGraph();
        drawViz();
        btn.textContent = '❚❚';
        btn.classList.add('playing');
        status.textContent = statusPlayingText();
        playing = true;
        startElapsedTimer();
      } catch (err) {
        status.textContent = 'Audio error: ' + err.message;
      }
    }).catch(err => {
      status.textContent = 'Could not start audio: ' + err.message;
    });
  } else {
    teardownGraph();
    btn.textContent = '▶';
    btn.classList.remove('playing');
    status.textContent = 'Tap play to start';
    playing = false;
    stopElapsedTimer();
  }
});

document.getElementById('modeSelect').addEventListener('change', (e) => {
  const opt = e.target.selectedOptions[0];
  modRate = parseFloat(opt.value);
  modBandLabel = opt.dataset.band;
  if (playing && lfo) {
    lfo.frequency.setTargetAtTime(modRate, ctx.currentTime, 0.3);
    document.getElementById('status').textContent = statusPlayingText();
  }
});

document.getElementById('depth').addEventListener('input', (e) => {
  const depth = parseFloat(e.target.value) / 100;
  document.getElementById('depthVal').textContent = e.target.value + '%';
  if (playing && busGain) {
    busGain.gain.setTargetAtTime(1 - depth / 2, ctx.currentTime, 0.2);
    lfoGain.gain.setTargetAtTime(depth / 2, ctx.currentTime, 0.2);
  }
});

document.getElementById('padVol').addEventListener('input', (e) => {
  document.getElementById('padVal').textContent = e.target.value + '%';
  if (playing && padGains[0]) {
    padGains[0].gain.setTargetAtTime(parseFloat(e.target.value) / 100, ctx.currentTime, 0.2);
  }
});

document.getElementById('noiseVol').addEventListener('input', (e) => {
  document.getElementById('noiseVal').textContent = e.target.value + '%';
  if (playing && noiseGain) {
    noiseGain.gain.setTargetAtTime(parseFloat(e.target.value) / 100 * 0.6, ctx.currentTime, 0.2);
  }
});

document.getElementById('noiseType').addEventListener('change', (e) => {
  noiseTypeSelected = e.target.value;
  if (playing && noiseGain) {
    noiseCleanup && noiseCleanup.stop();
    noiseCleanup = buildNoiseSource(noiseTypeSelected, noiseGain);
  }
});

document.getElementById('noiseAMToggle').addEventListener('change', (e) => {
  noiseAMEnabled = e.target.checked;
  if (playing && noiseGain) {
    noiseGain.disconnect();
    noiseGain.connect(noiseAMEnabled ? busGain : dryBus);
  }
});

function resizeCanvasToDisplaySize() {
  // Two rAFs: gives the browser a chance to finish layout after a class
  // change (entering/exiting fullscreen) before we read clientWidth/Height.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const canvas = document.getElementById('viz');
    canvas.width = canvas.clientWidth * devicePixelRatio;
    canvas.height = canvas.clientHeight * devicePixelRatio;
    if (vizMode === 'particles') initParticles(canvas);
  }));
}

function enterPseudoFullscreen() {
  const wrap = document.getElementById('vizWrap');
  wrap.classList.add('fullscreen-active');
  document.body.style.overflow = 'hidden';
  document.getElementById('fullscreenBtn').textContent = '✕';
  resizeCanvasToDisplaySize();
}

function exitPseudoFullscreen() {
  const wrap = document.getElementById('vizWrap');
  wrap.classList.remove('fullscreen-active');
  document.body.style.overflow = '';
  document.getElementById('fullscreenBtn').textContent = '⛶';
  resizeCanvasToDisplaySize();
}

function toggleFullscreen() {
  const wrap = document.getElementById('vizWrap');
  const nativeFsElement = document.fullscreenElement || document.webkitFullscreenElement;

  if (nativeFsElement) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    return;
  }
  if (wrap.classList.contains('fullscreen-active')) {
    exitPseudoFullscreen();
    return;
  }

  // Try the real Fullscreen API first (works on desktop, Android, iPadOS).
  // iPhone Safari historically doesn't support it reliably, so we fall
  // back to a CSS-only "cover the viewport" mode that works everywhere.
  const reqFs = wrap.requestFullscreen || wrap.webkitRequestFullscreen;
  if (reqFs) {
    const result = reqFs.call(wrap);
    if (result && result.then) {
      result.then(() => {
        wrap.classList.add('fullscreen-active');
        document.getElementById('fullscreenBtn').textContent = '✕';
        resizeCanvasToDisplaySize();
      }).catch(() => enterPseudoFullscreen());
    } else {
      // Older WebKit fullscreen calls don't return a promise.
      wrap.classList.add('fullscreen-active');
      document.getElementById('fullscreenBtn').textContent = '✕';
      resizeCanvasToDisplaySize();
    }
  } else {
    enterPseudoFullscreen();
  }
}

document.getElementById('fullscreenBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  toggleFullscreen();
});

// Tap the visualizer itself to exit, same as most fullscreen visualizers.
document.getElementById('viz').addEventListener('click', () => {
  const wrap = document.getElementById('vizWrap');
  if (document.fullscreenElement || document.webkitFullscreenElement || wrap.classList.contains('fullscreen-active')) {
    toggleFullscreen();
  }
});

document.addEventListener('fullscreenchange', () => {
  const wrap = document.getElementById('vizWrap');
  if (!document.fullscreenElement) {
    wrap.classList.remove('fullscreen-active');
    document.getElementById('fullscreenBtn').textContent = '⛶';
  }
  resizeCanvasToDisplaySize();
});
document.addEventListener('webkitfullscreenchange', () => {
  const wrap = document.getElementById('vizWrap');
  if (!document.webkitFullscreenElement) {
    wrap.classList.remove('fullscreen-active');
    document.getElementById('fullscreenBtn').textContent = '⛶';
  }
  resizeCanvasToDisplaySize();
});

window.addEventListener('resize', () => resizeCanvasToDisplaySize());

document.getElementById('vizModeSelect').addEventListener('change', (e) => {
  vizMode = e.target.value;
});

document.getElementById('chordLoopToggle').addEventListener('change', (e) => {
  chordLoopEnabled = e.target.checked;
  document.getElementById('chordControls').style.display = chordLoopEnabled ? 'block' : 'none';
  const status = document.getElementById('status');
  if (playing) {
    if (chordLoopEnabled) {
      scheduleNextChord();
    } else {
      clearTimeout(chordTimeoutId);
    }
    status.textContent = statusPlayingText();
  }
});

document.getElementById('progressionSelect').addEventListener('change', (e) => {
  currentProgressionKey = e.target.value;
  // Takes effect on the next scheduled chord change — no need to rebuild anything.
});

document.getElementById('chordLength').addEventListener('input', (e) => {
  chordDuration = parseFloat(e.target.value);
  document.getElementById('chordLenVal').textContent = chordDuration + 's';
  if (playing && chordLoopEnabled) {
    scheduleNextChord(); // reschedules from now with the new duration
  }
});
</script>
</body>
</html>
